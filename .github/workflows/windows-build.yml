name: Windows Build

on:
  push:
    branches: [main, arena/*]
  pull_request:
    branches: [main]

jobs:
  build-vst3-standalone:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE / CMake
        uses: actions/cache@v4
        with:
          path: |
            build/
            deps/
          key: ${{ runner.os }}-cmake-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}

      - name: Setup MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake --preset win-x64

      - name: Build VST3 + Standalone (Release)
        run: cmake --build --preset release --config Release --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: samplegod-windows-release
          path: build/win-x64/Release/*.vst3

      - name: Upload standalone
        uses: actions/upload-artifact@v4
        if: failure() == false
        with:
          name: samplegod-standalone-release
          path: build/win-x64/Release/*.exe
