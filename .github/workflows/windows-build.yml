name: Windows Build

on:
  push:
    branches: [main, arena/*]
  pull_request:
    branches: [main]

jobs:
  build-vst3-standalone:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake --preset win-x64

      - name: Build VST3 + Standalone (Release)
        run: cmake --build --preset release --config Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: samplegod-windows
          path: |
            build/win-x64/Release/*.vst3
            build/win-x64/Release/*.exe
